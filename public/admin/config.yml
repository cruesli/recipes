site_url: https://mtrecipes.netlify.app
display_url: "https://cruesli.github.io/recipes/"
backend:
  name: git-gateway
  branch: main

# Where Decap will store uploaded images in your repo:
media_folder: "public/images/recipes"
public_folder: "/images/recipes"

# Optional but recommended for local development
local_backend: true

collections:
  - name: "meta"
    label: "Meta"
    files:
      - label: "Cuisines"
        name: "cuisines"
        file: "src/content/meta/cuisines.json"
        format: "json"
        fields:
          - name: "cuisines"
            label: "Cuisines"
            widget: "list"
            allow_add: true
            fields:
              - { name: "slug", label: "Slug", widget: "string", hint: "lowercase + hyphens, e.g. italian, tex-mex, bbq" }
              - { name: "label", label: "Label (optional)", widget: "string", required: false, hint: "e.g. BBQ, Tex-Mex" }
      - label: "Pantry staples"
        name: "staples"
        file: "src/content/meta/staples.json"
        format: "json"
        fields:
          - name: "staples"
            label: "Staples (canonical ingredient names, lowercase)"
            widget: "list"
            allow_add: true
            field: { name: "name", label: "Canonical name", widget: "string" }
  - name: "recipes"
    label: "Recipes"
    folder: "src/content/recipes"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - name: "cuisine"
        label: "Cuisine"
        widget: "relation"
        collection: "meta"
        file: "cuisines"
        search_fields: ["cuisines.*.slug", "cuisines.*.label"]
        value_field: "cuisines.*.slug"
        display_fields: ["cuisines.*.label", "cuisines.*.slug"]
      - { name: "intro", label: "Headnote (optional, Norwegian)", widget: "text", required: false, hint: "A sentence or two shown in italics above the recipe. Leave empty for none." }
      - { name: "date", label: "Date added", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Drives the newest-first ordering on the home page." }
      - { name: "foodType", label: "Food type", widget: "string", required: false }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "servings", label: "Servings", widget: "number", value_type: "int", required: false, min: 1 }
      - { name: "totalTimeMinutes", label: "Total time (minutes)", widget: "number", value_type: "int", required: false, min: 1, hint: "Leave empty to use prep + cook below." }
      - { name: "prepTimeMinutes", label: "Prep time (minutes)", widget: "number", value_type: "int", required: false, min: 0 }
      - { name: "cookTimeMinutes", label: "Cook time (minutes)", widget: "number", value_type: "int", required: false, min: 0 }
      - { name: "marinadeTimeMinutes", label: "Marinade time (minutes)", widget: "number", value_type: "int", required: false, min: 0, hint: "Do-ahead soak; 480 for overnight." }
      - { name: "season", label: "Season", widget: "string", required: false }
      - { name: "image", label: "Image", widget: "image", required: false }
      - { name: "ingredients", label: "Ingredients", widget: "markdown"}
      # Recipe body as markdown (keeps your current rendering intact)
      - { name: "body", label: "Recipe", widget: "markdown" }

  - name: "meal-plans"
    label: "Meal Plans"
    files:
      - label: "Current week"
        name: "current-week"
        file: "src/content/meal-plans/current-week.json"
        format: "json"
        fields:
          - { name: "weekStart", label: "Week start (YYYY-MM-DD)", widget: "string" }
          - name: "days"
            label: "Days"
            widget: "object"
            fields:
              - name: "monday"
                label: "Monday"
                widget: "object"
                fields:
                  - { name: "recipeSlug", label: "Recipe slug", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "string", required: false }
              - name: "tuesday"
                label: "Tuesday"
                widget: "object"
                fields:
                  - { name: "recipeSlug", label: "Recipe slug", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "string", required: false }
              - name: "wednesday"
                label: "Wednesday"
                widget: "object"
                fields:
                  - { name: "recipeSlug", label: "Recipe slug", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "string", required: false }
              - name: "thursday"
                label: "Thursday"
                widget: "object"
                fields:
                  - { name: "recipeSlug", label: "Recipe slug", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "string", required: false }
              - name: "friday"
                label: "Friday"
                widget: "object"
                fields:
                  - { name: "recipeSlug", label: "Recipe slug", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "string", required: false }
              - name: "saturday"
                label: "Saturday"
                widget: "object"
                fields:
                  - { name: "recipeSlug", label: "Recipe slug", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "string", required: false }
              - name: "sunday"
                label: "Sunday"
                widget: "object"
                fields:
                  - { name: "recipeSlug", label: "Recipe slug", widget: "string", required: false }
                  - { name: "notes", label: "Notes", widget: "string", required: false }

  - name: "journal"
    label: "Kitchen journal"
    folder: "src/content/journal"
    format: "json"
    extension: "json"
    create: true
    identifier_field: slug
    slug: "{{slug}}"
    fields:
      - { name: "slug", label: "Recipe slug", widget: "string", hint: "Must match the recipe filename, e.g. carnitas" }
      - name: "entries"
        label: "Notes"
        widget: "list"
        fields:
          - { name: "date", label: "Date (YYYY-MM-DD)", widget: "string" }
          - { name: "note", label: "Note", widget: "text" }
          - name: "anchor"
            label: "Anchor"
            widget: "object"
            fields:
              - { name: "type", label: "Type", widget: "select", options: ["top", "ingredients", "step"], default: "step" }
              - { name: "n", label: "Step number (for step anchors)", widget: "number", value_type: "int", required: false, min: 1 }
          - { name: "seed", label: "Placement seed (any integer)", widget: "number", value_type: "int", default: 1 }
