name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build with Astro
        run: npm run build
        env:
          # Annotate mode (in-page journal writing) → Netlify Identity + git-gateway.
          # Reuses the same backend Decap /admin uses. Unset would leave it inert.
          PUBLIC_ANNOTATE_ORIGIN: https://mtrecipes.netlify.app
          # NL search: stateless FastAPI query service on Google Cloud Run
          # (project magnus-recipes-nl, europe-north1, scale-to-zero). Check <url>/health if it stalls.
          PUBLIC_NLP_API_URL: https://recipe-nl-3flwzokcma-lz.a.run.app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4